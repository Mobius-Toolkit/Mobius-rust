name: release

on:
  push:
    branches: [main]

# The GITHUB_TOKEN can create a tag only on the head of main, so a newer push cancels the older run.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml

  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$last" ]; then
            echo "tag=v0.1.0" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${last%.*}.$((${last##*.} + 1))" >> "$GITHUB_OUTPUT"
          fi

  bundle:
    needs: [check, tag]
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # A binary needs the glibc of its build host or a newer one. Ubuntu 22.04 has an older glibc than Debian 12.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
      # The dx version must match the dioxus version in Cargo.lock.
      - run: cargo install dioxus-cli --version 0.7.10 --locked
      - run: dx bundle --web --release -p mobius --out-dir dist
        env:
          MOBIUS_VERSION: ${{ needs.tag.outputs.tag }}
      # Dioxus reads public/ next to the executable.
      - run: |
          mv dist/server dist/mobius
          tar -czf mobius-${{ matrix.target }}.tar.gz -C dist mobius public
      - uses: actions/upload-artifact@v4
        with:
          name: mobius-${{ matrix.target }}
          path: mobius-${{ matrix.target }}.tar.gz

  release:
    needs: [tag, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" mobius-*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
