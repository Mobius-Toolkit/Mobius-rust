name: screenshots

on:
  pull_request:

concurrency:
  group: screenshots-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.ui.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ui
        run: |
          ui=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} | .github/scripts/ui-changed.sh)
          echo "ui=$ui" >> "$GITHUB_OUTPUT"

  screenshots:
    needs: changes
    # A skipped job counts as a pass for a required check, so a pull request with no UI changes can merge.
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The job pushes to the pull request branch, so it checks out that branch and not the merge commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The dx version must match the dioxus version in Cargo.lock.
      - run: cargo install dioxus-cli --version 0.7.10 --locked
      - run: dx bundle --web --release -p mobius --out-dir dist
      # Each test starts its own Chrome. One test at a time keeps the Chrome starts from competing for the runner.
      - run: cargo test -p mobius-testkit --test it -- screenshots:: --ignored --test-threads=1
        env:
          DIOXUS_PUBLIC_PATH: ${{ github.workspace }}/dist/public
          MOBIUS_VERSION: v0.1.0
      # Without `[skip ci]`, GitHub starts the pull_request workflows for this push and holds them for the approval of a maintainer.
      - run: |
          git add crates/mobius-ui/screenshots
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "test: update the UI screenshots [skip ci]"
          git push
