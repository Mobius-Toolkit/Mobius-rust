[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
dioxus = "=0.7.10"
dioxus-ssr = "=0.7.10"
dioxus-icons = "0.1.0"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9a758255ea26e2b20c8cecf4c1c946feb9e71da7" }
pulldown-cmark = { version = "=0.13.4", default-features = false }
agent-client-protocol = "=2.2.0"
rmcp = { version = "=3.4.1", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "time"] }
octocrab = "0.54"
secrecy = "0.10"
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem"] }
humantime-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "1"
time = "0.3"
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"
base64 = "0.22"
tower = "0.5"
tempfile = "3"
axum = "0.8"
http = "1"
chromiumoxide = "0.9"
futures-util = "0.3"
png = "0.18"
web-sys = { version = "=0.3.106", default-features = false }

mobius-ui = { path = "crates/mobius-ui" }
mobius-api = { path = "crates/mobius-api" }
mobius-domain = { path = "crates/mobius-domain" }
mobius-engine = { path = "crates/mobius-engine" }
mobius-store = { path = "crates/mobius-store" }
mobius-github = { path = "crates/mobius-github" }
mobius-runner = { path = "crates/mobius-runner" }
