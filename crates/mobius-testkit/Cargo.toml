[package]
name = "mobius-testkit"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
agent-client-protocol = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
mobius-engine = { workspace = true }
mobius-store = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["macros", "net", "sync", "time"] }
toml = { workspace = true }

[dev-dependencies]
chromiumoxide = { workspace = true }
dioxus = { workspace = true, features = ["fullstack", "server"] }
futures-util = { workspace = true }
mobius-api = { workspace = true, features = ["server"] }
mobius-domain = { workspace = true }
mobius-ui = { workspace = true, features = ["server"] }
png = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["macros", "test-util"] }
tower = { workspace = true, features = ["util"] }
